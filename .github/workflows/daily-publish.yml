name: Autonomous 50-Post Daily Publishing

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Batch Research & Publishing (50 Posts)
        run: node scripts/publish-daily.js --count=50

      - name: Build Updated Static Site
        run: npm run build

      - name: Commit & Push New Articles
        run: |
          git config --global user.name "PawPulse Bot"
          git config --global user.email "bot@pawpulse.org"
          git add database/pawpulse.db database/pawpulse.db-wal database/pawpulse.db-shm
          git commit -m "Auto-published 50 fresh pet guides [skip ci]" || echo "No changes to commit"
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
