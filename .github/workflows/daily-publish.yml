name: Autonomous 50-Post Daily Publishing

on:
  schedule:
    # Runs at 00:00 UTC every day (Cloud automation)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      post_count:
        description: 'Number of articles to generate & publish'
        required: false
        default: '50'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Batch Research & Publishing (50 Posts)
        run: node scripts/publish-daily.js --count=${{ github.event.inputs.post_count || 50 }}

      - name: Build Updated Static Site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit & Push Updated Database
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/pawpulse.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Auto-published 50 fresh pet guides [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Push non-fatal warning: static site was already deployed to GitHub Pages."
          fi
