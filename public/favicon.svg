  <!-- Toe 2 -->
  <ellipse cx="28" cy="18" rx="4" ry="6" fill="#ffffff" transform="rotate(-5 28 18)"/>
  <!-- Toe 3 -->
  <ellipse cx="36" cy="18" rx="4" ry="6" fill="#ffffff" transform="rotate(5 36 18)"/>
  <!-- Toe 4 -->
