      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pawGrad)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Main Paw Pad -->
  <path d="M32 46 C24 46, 20 40, 20 34 C20 30, 24 28, 28 30 C30 31, 31 32, 32 32 C33 32, 34 31, 36 30 C40 28, 44 30, 44 34 C44 40, 40 46, 32 46 Z" fill="#ffffff"/>
